<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (64x64 at x=4, y=4) -->
  <g transform="translate(4, 4)">
    <rect width="64" height="64" rx="16" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="1.5" />
    
    <!-- Shield -->
    <path d="M 32 12 C 42 12, 48 16, 48 24 C 48 36, 40 46, 32 52 C 24 46, 16 36, 16 24 C 16 16, 22 12, 32 12 Z" 
          fill="#1e1b4b" 
          stroke="rgba(255, 255, 255, 0.15)" 
          stroke-width="1" />
    
    <!-- Geometric 'P' -->
    <rect x="23.5" y="20" width="4.5" height="24" rx="2" fill="url(#pGrad)" />
    <path d="M 27.5 20 H 36 C 42 20, 42 30, 36 30 H 27.5 Z" 
          fill="none" 
          stroke="url(#pGrad)" 
          stroke-width="4.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
    
    <!-- Verified Checkmark -->
    <path d="M 26 35 L 32.5 41.5 L 45 26" 
          fill="none" 
          stroke="url(#checkGrad)" 
          stroke-width="4.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <circle cx="45" cy="26" r="2.2" fill="#6ee7b7" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(82, 42)">
    <!-- Main Wordmark -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em">
      <tspan fill="#0f172a">Proof</tspan><tspan fill="url(#textGrad)">Patcher</tspan>
    </text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(84, 59)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.04em">
      FALSIFIABLE AI CO-MAINTAINER
    </text>
  </g>
</svg>
