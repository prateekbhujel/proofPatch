<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="favP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="favCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="32" height="32" rx="7" fill="url(#favBg)" />

  <!-- Shield Shape -->
  <path d="M 16 4 C 22 4, 26 6, 26 12 C 26 18, 21 24, 16 28 C 11 24, 6 18, 6 12 C 6 6, 10 4, 16 4 Z" 
        fill="#1e1b4b" 
        stroke="#4338ca" 
        stroke-width="0.8" />

  <!-- Interlocking "P" -->
  <rect x="11.5" y="8.5" width="2.8" height="13" rx="1.2" fill="url(#favP)" />
  <path d="M 13.5 8.5 H 18.5 C 21.5 8.5, 21.5 14, 18.5 14 H 13.5 Z" 
        fill="none" 
        stroke="url(#favP)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Verification Check -->
  <path d="M 13 17 L 16.5 21 L 23.5 12.5" 
        fill="none" 
        stroke="url(#favCheck)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
